[build-system]
requires = ["uv_build==0.12.12"]
build-backend = "uv_build"

[project]
name = "career-intelligence"
version = "0.1.0"
description = "Evidence-backed job monitoring and career recommendations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
    "sqlalchemy>=2.0,<3",
]

[project.scripts]
career-intelligence = "career_intelligence.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "uv-build==0.12.12"]

[tool.uv]
required-version = "==0.12.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
