name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.12"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run --locked --offline python -m ruff check .
      - run: uv run --locked --offline python -m ruff format --check .

  tests:
    name: Tests and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.12"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run --locked --offline python -m pytest
      - run: uv run --locked --offline career-intelligence config validate --config conf/settings.yml
      - name: Preview a Greenhouse fixture
        run: uv run --locked --offline career-intelligence collect --config conf/settings.yml --fixture tests/fixtures/greenhouse/initial.json
      - name: Persist a Greenhouse fixture
        run: uv run --locked --offline career-intelligence collect --config conf/settings.yml --fixture tests/fixtures/greenhouse/initial.json --persist
      - name: List persisted jobs
        run: uv run --locked --offline career-intelligence jobs list --config conf/settings.yml
      - run: uv build --no-build-isolation --offline
      - name: Verify installed wheel in a fresh environment
        run: uv run --locked --offline python scripts/check_distribution.py
